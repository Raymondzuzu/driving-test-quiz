<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>学科試験｜間違えた問題集</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--text:#172033;--sub:#667085;--line:#e1e6ee;--blue:#2f6fec;--blueSoft:#edf3ff;--green:#126a3e;--greenBg:#eaf8f0;--red:#a72828;--redBg:#fff0f0;--amber:#9a6700;--amberBg:#fff7db}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}button,select{font:inherit}.wrap{max-width:760px;margin:auto;padding:16px 14px 40px}h1{font-size:22px;margin:0 0 4px}.sub,.small{font-size:13px;color:var(--sub);line-height:1.5}.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.mode{border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 6px;color:var(--blue);font-weight:700}.mode.active{background:var(--blue);color:#fff;border-color:var(--blue)}#unansweredBtn{grid-column:1/-1}.rangebar{display:flex;align-items:center;gap:10px;margin:10px 0 12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}.rangebar label{font-size:13px;color:var(--sub);font-weight:700}.rangebar select{flex:1;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff;color:var(--text)}.summary{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:10px 6px;text-align:center}.stat .label{font-size:12px;color:var(--sub)}.stat b{display:block;font-size:20px;margin-top:2px}.progress{height:8px;background:#e7ebf1;border-radius:99px;overflow:hidden;margin:12px 0 18px}.bar{height:100%;background:var(--blue)}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 4px 16px rgba(24,32,51,.04)}.meta{display:flex;justify-content:space-between;gap:10px;color:var(--sub);font-size:13px;margin-bottom:14px}.q{font-size:20px;line-height:1.7;font-weight:700;min-height:220px;display:flex;align-items:center}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.answer{border:2px solid transparent;border-radius:16px;background:var(--blueSoft);color:var(--blue);font-size:34px;font-weight:800;padding:17px 8px}.answer.selected{border-color:var(--blue);background:#dce9ff}.answer:disabled{opacity:.72}.feedback{display:none;margin-top:16px;border-radius:14px;padding:15px;line-height:1.55}.feedback.good{display:block;background:var(--greenBg);color:var(--green)}.feedback.bad{display:block;background:var(--redBg);color:var(--red)}.feedback .tip{color:var(--text);margin-top:8px}.actions{display:flex;gap:8px;margin-top:16px}.secondary,.primary,.warn{border-radius:12px;padding:11px 14px;border:1px solid var(--line)}.secondary{background:#fff;color:var(--text)}.primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700;margin-left:auto}.warn{background:var(--amberBg);color:var(--amber);border-color:#f0d98a}.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:700}.badge.wrong{background:var(--redBg);color:var(--red)}.badge.mastered{background:var(--greenBg);color:var(--green)}.notice{margin-top:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12px;color:var(--sub);line-height:1.5}.restore{margin-top:12px;width:100%}.empty{text-align:center;padding:28px 8px}
</style>
</head>
<body>
<div class="wrap">
<header><h1>学科試験｜間違えた問題集</h1><div class="sub">Safari保存版：正解・不正解・回答済み・苦手を端末内に保存。苦手は手動解除するまで残ります</div></header>
<div class="toolbar"><button id="allBtn" class="mode active" onclick="setMode('all')">全144問</button><button id="wrongBtn" class="mode" onclick="setMode('wrong')">苦手だけ</button><button id="unansweredBtn" class="mode" onclick="setMode('unanswered')">未回答</button></div>
<div class="rangebar"><label for="rangeSelect">問題範囲</label><select id="rangeSelect" onchange="setRange(this.value)"><option value="allrange">すべて（1〜144）</option><option value="1-50">1〜50</option><option value="51-100">51〜100</option><option value="101-150">101〜144</option></select></div>
<div class="summary"><div class="stat"><div class="label">正解</div><b id="correctStat">0</b></div><div class="stat"><div class="label">不正解</div><b id="incorrectStat">0</b></div><div class="stat"><div class="label">回答済み</div><b id="answeredStat">0</b></div><div class="stat"><div class="label">苦手</div><b id="weakStat">0</b></div></div>
<div class="progress"><div id="bar" class="bar"></div></div><div id="app" class="card"><div class="empty">問題を読み込み中…</div></div>
<div class="notice">保存先はSafariの端末内データです。Safariの「履歴とWebサイトデータ」を消した場合や、別の端末・ブラウザで開いた場合は引き継がれません。</div>
<button class="secondary restore" onclick="resetAll()">全記録をリセット</button>
</div>
<script>
const LEGACY_URL='https://raw.githubusercontent.com/Raymondzuzu/driving-test-quiz/398bc923951533681ea177bf94cf1ea862297926/index.html';
const EXTRA=[
{id:132,q:'夜間、一般道路に普通自動車を駐停車する場合は、車の後方に停止表示器材を置けば、非常点滅表示灯等をつける必要はない。',a:true,tip:'正しい。一般道路では停止表示器材を置くことで、非常点滅表示灯等を必ずつける必要はない。高速道路での駐停車では、停止表示器材に加えて非常点滅表示灯等も必要。'},
{id:133,q:'信号機がある踏切で信号機が青色を示している場合でも、車は直前で一時停止しなければならない。',a:false,tip:'踏切に信号機があり青色を示している場合は、左右の安全を確認すれば一時停止する必要はない。'},
{id:134,q:'故障車をロープやクレーンでけん引する場合は、けん引免許は必要ない。',a:true,tip:'故障車をロープやクレーンなどでけん引する場合、けん引免許は不要。'},
{id:135,q:'長い下り坂でブレーキを頻繁に使うと、ハイドロプレーニング現象が起きることがあるので、エンジンブレーキを十分に活用する。',a:false,tip:'長い下り坂でブレーキを多用した場合に起こりやすいのは、ハイドロプレーニングではなくベーパーロック現象やフェード現象。エンジンブレーキを活用する。'},
{id:136,q:'横断歩道や自転車横断帯の前後30メートルは、追い越し禁止である。',a:false,tip:'追越し禁止なのは横断歩道・自転車横断帯と、その手前30メートル。向こう側30メートルまで一律に禁止ではない。'},
{id:137,q:'こう配の急な坂の頂上付近は駐停車禁止だが、こう配の急な坂の途中は駐停車禁止ではない。',a:false,tip:'こう配の急な坂は、頂上付近だけでなく途中も駐停車禁止。'},
{id:138,q:'自家用の普通乗用自動車は、1年ごとに定期点検を行わなければならない。',a:true,tip:'自家用の普通乗用自動車は1年ごとに定期点検を行う必要がある。'},
{id:139,q:'貨物自動車の荷台には、荷物の積み下ろしのための最小限必要な人のみ例外的に乗ってよい。',a:false,tip:'荷台への乗車が例外的に認められるのは、荷物を見張るための最小限必要な人。積み下ろしのため、という記述は誤り。'},
{id:140,q:'5分を超える人の乗り降りのための停止は、停車である。',a:true,tip:'人の乗り降りのための停止は、5分を超えても停車として扱われる。'},
{id:141,q:'乗り降りのために停止している通学バスのそばを通るときは、徐行して進行すればよい。',a:true,tip:'乗り降りのために停止している通学バスのそばを通るときは、一時停止または徐行して進行する。'},
{id:142,q:'普通自動車には、車体から左右に0.15メートルまではみ出して荷物を積むことができる。',a:false,tip:'普通自動車は、車体の左右それぞれについて車体の幅の10分の1以下まで、はみ出して積載できる。左右それぞれ0.15mという基準は二輪車・原動機付自転車。'},
{id:143,q:'自家用の普通自動車は、1日1回、運行前に日常点検を行わなければならない。',a:false,tip:'自家用の普通自動車の日常点検は1日1回と一律に決まっておらず、運行状態や走行距離などを考えて適切な時期に行う。'},
{id:144,q:'白杖を持った人の傍を通ったので、徐行して通行を妨げないようにした。',a:true,tip:'白杖や黄色の杖を持つ人などのそばを通るときは、一時停止または徐行して、その通行を妨げないようにする。'}];
const KEY='gakkaQuiz47_state_v1';let QUESTIONS=[],state,mode='all',range='allrange',list=[],idx=0,answeredThisView=false;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function freshState(){const byId={};QUESTIONS.forEach(q=>byId[q.id]={attempts:0,wrongCount:[35,36,42].includes(q.id)?1:0,lastCorrect:[35,36,42].includes(q.id)?false:null,lastAnsweredAt:null,weak:[35,36,42].includes(q.id),weakDismissed:false});return{byId,mode:'all',range:'allrange',indexByMode:{all:0,wrong:0,unanswered:0}}}
function loadState(){try{const raw=localStorage.getItem(KEY);const s=raw?JSON.parse(raw):freshState();QUESTIONS.forEach(q=>{if(!s.byId[q.id])s.byId[q.id]={attempts:0,wrongCount:0,lastCorrect:null,lastAnsweredAt:null,weak:false,weakDismissed:false};if(typeof s.byId[q.id].weak!=='boolean')s.byId[q.id].weak=s.byId[q.id].wrongCount>0&&s.byId[q.id].weakDismissed!==true});if(!s.indexByMode)s.indexByMode={all:0,wrong:0,unanswered:0};return s}catch(e){return freshState()}}
function saveState(){state.mode=mode;state.range=range;state.indexByMode[mode]=idx;localStorage.setItem(KEY,JSON.stringify(state))}
function isWrong(id){return !!state.byId[id]?.weak}function isAnswered(id){return (state.byId[id]?.attempts||0)>0}function isMastered(id){return state.byId[id]?.lastCorrect===true}
function rebuildList(){list=mode==='wrong'?QUESTIONS.filter(q=>isWrong(q.id)):mode==='unanswered'?QUESTIONS.filter(q=>!isAnswered(q.id)):[...QUESTIONS];if(range==='1-50')list=list.filter(q=>q.id<=50);else if(range==='51-100')list=list.filter(q=>q.id>=51&&q.id<=100);else if(range==='101-150')list=list.filter(q=>q.id>=101&&q.id<=150);idx=Math.min(state.indexByMode[mode]||0,Math.max(0,list.length-1))}
function renderStats(){const incorrect=QUESTIONS.reduce((n,q)=>n+(state.byId[q.id]?.wrongCount||0),0),attempts=QUESTIONS.reduce((n,q)=>n+(state.byId[q.id]?.attempts||0),0);correctStat.textContent=Math.max(0,attempts-incorrect);incorrectStat.textContent=incorrect;answeredStat.textContent=QUESTIONS.filter(q=>isAnswered(q.id)).length;weakStat.textContent=QUESTIONS.filter(q=>isWrong(q.id)).length}
function setMode(m){state.indexByMode[mode]=idx;mode=m;document.querySelectorAll('.mode').forEach(b=>b.classList.remove('active'));document.getElementById(m==='all'?'allBtn':m==='wrong'?'wrongBtn':'unansweredBtn').classList.add('active');rebuildList();saveState();render()}
function setRange(r){state.indexByMode[mode]=0;range=r;idx=0;rebuildList();saveState();render()}
function render(){renderStats();rangeSelect.value=range;if(!list.length){bar.style.width='0';app.innerHTML='<div class="empty">対象問題なし</div>';return}answeredThisView=false;const q=list[idx],s=state.byId[q.id],badge=isWrong(q.id)?'<span class="badge wrong">苦手</span>':isMastered(q.id)?'<span class="badge mastered">正解済み</span>':'';bar.style.width=((idx+1)/list.length*100)+'%';app.innerHTML=`<div class="meta"><span>${idx+1} / ${list.length}</span><span>${badge}</span></div><div class="small">問題番号 ${q.id}${s.wrongCount?'｜累計ミス '+s.wrongCount+'回':''}</div><div class="q">${esc(q.q)}</div><div class="answers"><button id="oBtn" class="answer" onclick="answer(true)">○</button><button id="xBtn" class="answer" onclick="answer(false)">×</button></div><div id="feedback" class="feedback"></div><div class="actions"><button class="secondary" onclick="prev()">← 前へ</button><button class="warn" onclick="toggleWeak(${q.id})">${isWrong(q.id)?'苦手解除':'苦手登録'}</button><button class="primary" onclick="next()">次へ →</button></div>`;saveState()}
function answer(v){if(answeredThisView)return;answeredThisView=true;const q=list[idx],s=state.byId[q.id],ok=v===q.a;s.attempts++;s.lastCorrect=ok;s.lastAnsweredAt=new Date().toISOString();if(!ok){s.wrongCount++;s.weak=true;s.weakDismissed=false}document.getElementById(v?'oBtn':'xBtn').classList.add('selected');document.querySelectorAll('.answer').forEach(b=>b.disabled=true);feedback.className='feedback '+(ok?'good':'bad');feedback.innerHTML=`<b>${ok?'✅ 正解！':'❌ 不正解'}　正解：${q.a?'○':'×'}</b><div class="tip">💡 ${esc(q.tip)}</div>`;saveState();renderStats()}
function next(){idx=(idx+1)%list.length;saveState();render()}function prev(){idx=(idx-1+list.length)%list.length;saveState();render()}function toggleWeak(id){const s=state.byId[id];if(isWrong(id)){s.weak=false;s.weakDismissed=true}else{s.weak=true;s.weakDismissed=false}saveState();rebuildList();render()}
function resetAll(){if(confirm('144問すべての回答履歴と苦手記録をリセットしますか？')){state=freshState();mode='all';range='allrange';rebuildList();saveState();render()}}
async function boot(){try{const html=await (await fetch(LEGACY_URL,{cache:'no-store'})).text();const m=html.match(/const QUESTIONS = (\[.*?\]);\nconst KEY/s);if(!m)throw new Error('旧問題集を読み込めません');QUESTIONS=JSON.parse(m[1]).concat(EXTRA);state=loadState();mode=state.mode||'all';range=state.range||'allrange';rebuildList();document.querySelectorAll('.mode').forEach(b=>b.classList.remove('active'));document.getElementById(mode==='all'?'allBtn':mode==='wrong'?'wrongBtn':'unansweredBtn').classList.add('active');render()}catch(e){app.innerHTML='<div class="empty">問題の読み込みに失敗しました。Safariで再読み込みしてください。</div>'}}
boot();
</script>
</body></html>
