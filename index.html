<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>学科試験｜間違えた問題集</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:#f4f6fa;color:#172033;margin:0;padding:24px}.box{max-width:720px;margin:auto;background:#fff;border:1px solid #e1e6ee;border-radius:16px;padding:20px;line-height:1.7}</style>
</head>
<body>
<div class="box" id="loading">問題集を読み込んでいます…</div>
<script>
(async()=>{
  try{
    const base='https://raw.githubusercontent.com/Raymondzuzu/driving-test-quiz/9164d74ff3d41d18d48aaf7755890b02cdd2ad43/index.html';
    let t=await (await fetch(base,{cache:'no-store'})).text();
    const extras=[
      {id:95,q:'【画像問題：黄色の枠の内側に白い長方形が描かれた道路標示】この標示は、立入り禁止部分を表し、車が通行してはいけない部分であることを示す。',a:false,tip:'この標示は「安全地帯」。歩行者が安全に待つための場所で、立入り禁止部分の標示とは別。'},
      {id:96,q:'自車が優先道路を通行している場合を除き、交差点とその手前30メートル以内の場所では、前の車を追い越してはならない。',a:true,tip:'交差点とその手前30m以内は追越し禁止。ただし、自車が優先道路を通行している場合は例外。踏切・横断歩道・自転車横断帯とその手前30m以内も追越し禁止。'},
      {id:97,q:'【画像問題：道路中央に黄色の実線がある】この標示があるところでは、右折をしても構わない。',a:true,tip:'黄色の中央線は、追越しのための右側部分へのはみ出しを禁止する標示。右折そのものを禁止する標示ではない。'},
      {id:98,q:'歩道がある道路で、車道の端に沿って駐車した。',a:true,tip:'歩道がある道路では、車道の左側端に沿って駐車する。歩道上に乗り上げて駐車してはいけない。'},
      {id:99,q:'路面電車を追い越す場合は、原則としてその右側を通行する。',a:false,tip:'路面電車を追い越すときは原則として左側を通行する。ただし、軌道敷が道路の左端にある場合などは右側を通行する。'},
      {id:100,q:'警笛鳴らせの標識のある場所では、見通しのきかない交差点、曲がり角、上り坂の頂上を通るときは、警音器を使用しなければならない。',a:false,tip:'「警笛鳴らせ」の標識がある場所では、その場所を通行するときは必ず警音器を鳴らす。問題文は「警笛区間」のルールと混同している。'},
      {id:101,q:'原動機付自転車は、自動車には含まれない。',a:true,tip:'道路交通法上、原動機付自転車は自動車とは別区分で、自動車には含まれない。'},
      {id:102,q:'転回の合図を行う時期は、転回の約30メートル手前である。',a:true,tip:'転回の合図は、転回しようとする地点の約30m手前で行う。'},
      {id:103,q:'フットブレーキが故障したため、ハンドブレーキを使って停止を試みた。',a:true,tip:'フットブレーキ故障時は、エンジンブレーキを使いながらハンドブレーキを徐々にかけて停止を試みる。'},
      {id:104,q:'【画像問題：黄色の枠の内側に白い長方形が描かれた道路標示】この標示は、安全地帯を示す。',a:true,tip:'黄色の枠の中に白い長方形がある標示は安全地帯を示す。'},
      {id:105,q:'【画像問題：道路中央に黄色の実線がある】この標示があるところでは、右折をしても構わない。',a:true,tip:'黄色の中央線は、追越しのための右側部分へのはみ出しを禁止するもの。右折は禁止していない。'},
      {id:106,q:'原則として、車の右側に3.5メートル以上の余地のない場所で駐車してはならない。',a:true,tip:'原則として、駐車した車の右側に3.5m以上の余地が必要。無余地駐車は禁止。'},
      {id:107,q:'夜間、駐車禁止でない場所に6時間駐車した。',a:true,tip:'同じ場所に夜間8時間以上、昼間12時間以上継続して駐車することは禁止。6時間ならこの時間制限には触れない。'},
      {id:108,q:'免許証を携帯することを忘れて自動車を運転すると、免許不携帯になる。',a:true,tip:'運転時は有効な運転免許証等を携帯する必要がある。携帯せず運転すると免許不携帯となる。'},
      {id:109,q:'右左折をしない場合、交差点を通行するときに徐行する必要はない。',a:false,tip:'右左折しなくても、交通整理のない見通しの悪い交差点など、条件によっては徐行義務がある。'},
      {id:110,q:'交差点とその前後30メートル以内の場所では、前の車を追い越してはならない。',a:false,tip:'追越し禁止なのは、原則として交差点とその手前30m以内。交差点の向こう側30mまで一律に禁止されるわけではない。'},
      {id:111,q:'右折の合図は、その行為をしようとする約3秒前で行う。',a:false,tip:'右左折の合図は右左折する地点の30m手前。約3秒前は進路変更の合図。'},
      {id:112,q:'路線バスの専用通行帯は、原動機付自転車や、小型特殊自動車は通行できる。',a:true,tip:'路線バス専用通行帯では、一般原動機付自転車や小型特殊自動車なども通行できる。'},
      {id:113,q:'交差点で警察官が両腕を垂直に上げているとき、警察官の身体に対面する方向の交通に対しては、赤色の灯火信号と同じ意味である。',a:true,tip:'警察官の身体に対面する方向の交通に対しては赤信号と同じ意味。'},
      {id:114,q:'歩道は軽車両以外の車は通行してはならない。',a:false,tip:'歩道は原則として車両の通行場所ではない。軽車両でも自由に通行できるわけではなく、標識等で認められた自転車などの例外がある。'},
      {id:115,q:'歩行者のそばを通るときは、必ず徐行せねばならない。',a:false,tip:'歩行者との間に安全な間隔をあけられる場合は、必ずしも徐行する必要はない。安全な間隔をあけられないときは徐行する。'},
      {id:116,q:'車両通行帯のない道路では、車は、道路の左に寄って通行する。',a:true,tip:'車両通行帯のない道路では、車は道路の左側に寄って通行する。'},
      {id:117,q:'追い越しが終わったので、すぐに追い越した車の前に入った。',a:false,tip:'追い越し後は、追い越した車との安全な車間距離を十分に確保してから元の進路に戻る。'},
      {id:118,q:'夜間、一般道路で普通自動車を駐車するときは、50メートル後方からはっきり見える場合は、駐車灯や尾灯をつけなくてよい。',a:true,tip:'夜間の駐車は原則として駐車灯や尾灯をつけるが、50m後方からはっきり見える場合などは点灯しなくてよい。'},
      {id:119,q:'通行している道路が優先道路のときは、左右の見通しがきかない交差点であっても、徐行する必要はない。',a:true,tip:'優先道路を通行している場合は、左右の見通しがきかない交差点でも、その理由だけで徐行する必要はない。'},
      {id:120,q:'車両横断禁止の標識がある場所でも、右折することはできる。',a:true,tip:'車両横断禁止は、道路に面した駐車場や店舗などへ入るため対向車線を横断する行為を禁止する標識。交差点での右折は禁止していない。'},
      {id:121,q:'乾いた舗装道路で、時速40キロメートルで走行中の車は、25メートル以上の車間距離をとることが必要である。',a:true,tip:'時速30〜60kmで走行する場合の目安は、速度計の数字から15を引いた距離（m）。40−15＝25m。'},
      {id:122,q:'駐車場や車庫などの出入り口から3メートル以内の場所では駐車が禁止されている。',a:true,tip:'駐車場や車庫など自動車用の出入口から3m以内は駐車禁止。所有者や関係者でも同じ。'},
      {id:123,q:'普通免許を受けている者は、最大積載量3トン未満の貨物自動車を運転できる。',a:false,tip:'普通免許で運転できる貨物自動車の最大積載量は2トン未満。2トン以上4.5トン未満は準中型免許の範囲。'},
      {id:124,q:'前方の信号が赤色であったが、青色の矢印信号が点灯したため、自動二輪車を発進させた。',a:true,tip:'自動二輪車も青色の矢印信号に従って、その矢印の方向へ進行できる。'}
    ];
    t=t.replace('}];\nconst KEY = ', '},'+extras.map(x=>JSON.stringify(x)).join(',')+'];\nconst KEY = ');
    t=t.replace('全94問','全124問');

    t=t.replace(
      '.summary{display:grid;',
      '.rangebar{display:flex;align-items:center;gap:10px;margin:10px 0 12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}.rangebar label{font-size:13px;color:var(--sub);font-weight:700}.rangebar select{flex:1;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff;color:var(--text);font:inherit}.summary{display:grid;'
    );

    t=t.replace(
`</div>\n\n<div class="summary">`,
`</div>\n\n<div class="rangebar">\n  <label for="rangeSelect">問題範囲</label>\n  <select id="rangeSelect" onchange="setRange(this.value)">\n    <option value="allrange">すべて（1〜124）</option>\n    <option value="1-50">1〜50</option>\n    <option value="51-100">51〜100</option>\n    <option value="101-150">101〜124</option>\n  </select>\n</div>\n\n<div class="summary">`
    );

    t=t.replace(
      "let mode = state.mode || 'all';\nlet list = [];",
      "let mode = state.mode || 'all';\nlet range = state.range || 'allrange';\nlet list = [];"
    );
    t=t.replace(
      'state.mode = mode;\n  localStorage.setItem(KEY, JSON.stringify(state));',
      'state.mode = mode;\n  state.range = range;\n  localStorage.setItem(KEY, JSON.stringify(state));'
    );

    t=t.replace(
`  else list = QUESTIONS.slice();
  let i = state.indexByMode[mode] || 0;`,
`  else list = QUESTIONS.slice();
  if(range==='1-50') list = list.filter(q => q.id >= 1 && q.id <= 50);
  else if(range==='51-100') list = list.filter(q => q.id >= 51 && q.id <= 100);
  else if(range==='101-150') list = list.filter(q => q.id >= 101 && q.id <= 150);
  let i = state.indexByMode[mode] || 0;`
    );

    t=t.replace(
`function setMode(m){
  mode=m; state.mode=m; answeredNow=false; selectedNow=null;
  rebuildList(); saveState(); render();
}`,
`function setMode(m){
  mode=m; state.mode=m; answeredNow=false; selectedNow=null;
  state.indexByMode[m]=0;
  rebuildList(); saveState(); render();
}

function setRange(r){
  range=r; state.range=r; answeredNow=false; selectedNow=null;
  state.indexByMode[mode]=0;
  rebuildList(); saveState(); render();
}`
    );

    t=t.replace(
      "document.getElementById('unansweredBtn').classList.toggle('active', mode==='unanswered');",
      "document.getElementById('unansweredBtn').classList.toggle('active', mode==='unanswered');\n  const rs=document.getElementById('rangeSelect'); if(rs) rs.value=range;"
    );

    t=t.replace(
      'function render(){\n  rebuildList(); updateStats();',
      'function render(){\n  if(!answeredNow) rebuildList(); updateStats();'
    );

    t=t.replace(
`function next(){
  answeredNow=false; selectedNow=null;
  rebuildList();
  let i=currentIndex();
  if(i < list.length-1) setCurrentIndex(i+1);
  else setCurrentIndex(0);
  render();
}`,
`function next(){
  const wasAnswered = answeredNow;
  answeredNow=false; selectedNow=null;
  rebuildList();
  let i=currentIndex();
  if(mode==='unanswered' && wasAnswered){
    if(i >= list.length) setCurrentIndex(Math.max(0,list.length-1));
    else setCurrentIndex(i);
  } else {
    if(i < list.length-1) setCurrentIndex(i+1);
    else setCurrentIndex(0);
  }
  render();
}`
    );

    document.open();
    document.write(t);
    document.close();
  }catch(e){
    document.getElementById('loading').innerHTML='読み込みに失敗しました。Safariで再読み込みしてください。';
  }
})();
</script>
</body>
</html>
