<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>学科試験｜間違えた問題集</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:#f4f6fa;color:#172033;margin:0;padding:24px}.box{max-width:720px;margin:auto;background:#fff;border:1px solid #e1e6ee;border-radius:16px;padding:20px;line-height:1.7}</style>
</head>
<body>
<div class="box" id="loading">問題集を読み込んでいます…</div>
<script>
(async()=>{
  try{
    const base='https://raw.githubusercontent.com/Raymondzuzu/driving-test-quiz/9164d74ff3d41d18d48aaf7755890b02cdd2ad43/index.html';
    let t=await (await fetch(base,{cache:'no-store'})).text();
    const extras=[
      {id:95,q:'【画像問題：黄色の枠の内側に白い長方形が描かれた道路標示】この標示は、立入り禁止部分を表し、車が通行してはいけない部分であることを示す。',a:false,tip:'この標示は「安全地帯」。歩行者が安全に待つための場所で、立入り禁止部分の標示とは別。'},
      {id:96,q:'自車が優先道路を通行している場合を除き、交差点とその手前30メートル以内の場所では、前の車を追い越してはならない。',a:true,tip:'交差点とその手前30m以内は追越し禁止。ただし、自車が優先道路を通行している場合は例外。踏切・横断歩道・自転車横断帯とその手前30m以内も追越し禁止。'},
      {id:97,q:'【画像問題：道路中央に黄色の実線がある】この標示があるところでは、右折をしても構わない。',a:true,tip:'黄色の中央線は、追越しのための右側部分へのはみ出しを禁止する標示。右折そのものを禁止する標示ではない。'},
      {id:98,q:'歩道がある道路で、車道の端に沿って駐車した。',a:true,tip:'歩道がある道路では、車道の左側端に沿って駐車する。歩道上に乗り上げて駐車してはいけない。'}
    ];
    t=t.replace('}];\nconst KEY = ', '},'+extras.map(x=>JSON.stringify(x)).join(',')+'];\nconst KEY = ');
    t=t.replace('全94問','全98問');

    // 回答した瞬間に「未回答」一覧から現在問が消えて次問へ飛ぶ不具合を修正。
    // 採点結果を表示している間は現在のリストを固定する。
    t=t.replace(
      'function render(){\n  rebuildList(); updateStats();',
      'function render(){\n  if(!answeredNow) rebuildList(); updateStats();'
    );

    // 「未回答」モードでは、次へを押した時点で回答済み問題を一覧から除外する。
    // その際、同じインデックスに繰り上がった次問を表示し、1問飛ばさない。
    t=t.replace(
`function next(){
  answeredNow=false; selectedNow=null;
  rebuildList();
  let i=currentIndex();
  if(i < list.length-1) setCurrentIndex(i+1);
  else setCurrentIndex(0);
  render();
}`,
`function next(){
  const wasAnswered = answeredNow;
  answeredNow=false; selectedNow=null;
  rebuildList();
  let i=currentIndex();
  if(mode==='unanswered' && wasAnswered){
    if(i >= list.length) setCurrentIndex(Math.max(0,list.length-1));
    else setCurrentIndex(i);
  } else {
    if(i < list.length-1) setCurrentIndex(i+1);
    else setCurrentIndex(0);
  }
  render();
}`
    );

    document.open();
    document.write(t);
    document.close();
  }catch(e){
    document.getElementById('loading').innerHTML='読み込みに失敗しました。Safariで再読み込みしてください。';
  }
})();
</script>
</body>
</html>
