<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>学科試験｜間違えた問題集</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:#f4f6fa;color:#172033;margin:0;padding:24px}.box{max-width:720px;margin:auto;background:#fff;border:1px solid #e1e6ee;border-radius:16px;padding:20px;line-height:1.7}</style>
</head>
<body>
<div class="box" id="loading">問題集を読み込んでいます…</div>
<script>
(async()=>{
  try{
    const base='https://raw.githubusercontent.com/Raymondzuzu/driving-test-quiz/09e92dac92e78e5a78e98bec2cb2cc89c4c3e961/index.html';
    let t=await (await fetch(base,{cache:'no-store'})).text();
    const q88={id:88,q:'道路の片側に障害物がある場合、行き違うときは、障害物のある側と反対側の車が減速や一時停止をして、対向車に道を譲る。',a:false,tip:'障害物のある側の車が、必要に応じて減速・一時停止して、障害物のない側の対向車に道を譲る。問題文は逆。'};
    t=t.replace('}];\nconst KEY = ', '},'+JSON.stringify(q88)+'];\nconst KEY = ');
    t=t.replace('全87問','全88問');
    t=t.replace('87問すべて','88問すべて');
    document.open();
    document.write(t);
    document.close();
  }catch(e){
    document.getElementById('loading').innerHTML='読み込みに失敗しました。Safariで再読み込みしてください。';
  }
})();
</script>
</body>
</html>
