<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>学科試験｜間違えた問題集</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:#f4f6fa;color:#172033;margin:0;padding:24px} .box{max-width:720px;margin:auto;background:#fff;border:1px solid #e1e6ee;border-radius:16px;padding:20px;line-height:1.7}</style>
</head>
<body>
<div class="box" id="loading">問題集を読み込んでいます…</div>
<script>
(async()=>{
  try{
    const base='https://raw.githubusercontent.com/Raymondzuzu/driving-test-quiz/eb27ffd3c3fdc73cef787c9b2c021f1eac770047/index.html';
    let t=await (await fetch(base,{cache:'no-store'})).text();

    t=t.replace(
      'return s && s.wrongCount>0 && s.lastCorrect!==true;',
      'return s && s.wrongCount>0 && s.weakDismissed!==true;'
    );

    t=t.replace(
      /lastAnsweredAt: null/g,
      'lastAnsweredAt: null, weakDismissed: false'
    );

    t=t.replace(
      's.lastCorrect = ok;\n  s.lastAnsweredAt = new Date().toISOString();\n  if(!ok) s.wrongCount += 1;',
      's.lastCorrect = ok;\n  s.lastAnsweredAt = new Date().toISOString();\n  if(!ok) { s.wrongCount += 1; s.weakDismissed = false; }'
    );

    t=t.replace(
`function toggleWeak(id) {
  const s=state.byId[id];
  if(isWrong(id)) {
    s.lastCorrect=true;
  } else {
    if(s.wrongCount===0) s.wrongCount=1;
    s.lastCorrect=false;
  }
  saveState();
  rebuildList();
  render();
}`,
`function toggleWeak(id) {
  const s=state.byId[id];
  if(isWrong(id)) {
    s.weakDismissed = true;
  } else {
    if(s.wrongCount===0) s.wrongCount=1;
    s.weakDismissed = false;
  }
  saveState();
  rebuildList();
  render();
}`
    );

    t=t.replace(
      'Correct answer marks it as mastered, but the historical wrongCount remains.',
      'Once a question has any mistake history, it stays in the weak list until manually removed.'
    );

    document.open();
    document.write(t);
    document.close();
  }catch(e){
    document.getElementById('loading').innerHTML='読み込みに失敗しました。Safariで再読み込みしてください。';
  }
})();
</script>
</body>
</html>
